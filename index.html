<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LongDev: Unity editor tools</title>
  <meta name="description" content="Unity editor tools and VR utilities, published on the Unity Asset Store as LongDev.">
  <meta name="theme-color" content="#161616">
  <meta property="og:title" content="LongDev">
  <meta property="og:description" content="Unity tools for the slow, repetitive parts of the job.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://longdev-assets.com/">
  <meta property="og:image" content="https://longdev-assets.com/img/batch-lightmap-baker.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://longdev-assets.com/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#assets">Skip to assets</a>

  <header class="top">
    <div class="top-inner">
      <a class="wordmark" href="#">LongDev</a>
      <nav aria-label="Sections">
        <a href="#assets">Assets</a>
        <a href="#roadmap">Roadmap</a>
        <a href="#about">About</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-text">
        <h1 id="tagline"></h1>
        <p class="intro" id="intro"></p>
        <div class="hero-links" id="hero-links"></div>
        <p class="hero-status" id="hero-status"></p>
      </div>
      <figure class="demo">
        <video id="demo-video" autoplay muted loop playsinline preload="metadata" poster="media/nubis-demo.jpg"
               aria-label="Nubis flying over a 126-million-point laser scan of downtown San Francisco, with the frame rate in the corner">
          <source src="media/nubis-demo.mp4" type="video/mp4">
        </video>
        <figcaption>
          <span><strong>Nubis</strong> streaming a 126-million-point scan of San Francisco, recorded in real time.</span>
          <a href="asset.html?a=nubis">About Nubis &rarr;</a>
        </figcaption>
      </figure>
    </section>

    <section id="assets" class="block">
      <div class="block-head">
        <h2>Assets</h2>
        <div class="filters" role="group" aria-label="Filter assets" id="filters"></div>
      </div>
      <div class="group" id="group-live">
        <h3 class="group-title">Available now</h3>
        <ul class="grid" id="grid-live"></ul>
      </div>
      <div class="group" id="group-soon">
        <h3 class="group-title">Coming soon</h3>
        <p class="group-note">Built and in Asset Store review or testing. Open one for a preview.</p>
        <ul class="grid" id="grid-soon"></ul>
      </div>
    </section>

    <section id="roadmap" class="block">
      <div class="block-head">
        <h2>Roadmap</h2>
        <p class="block-note">What's being built, in the order I'm working on it.</p>
      </div>
      <div class="panel roadmap-panel">
        <ol class="stage-scale" id="stage-scale" aria-hidden="true"></ol>
        <ol class="roadmap" id="roadmap-list"></ol>
      </div>
    </section>

    <section id="about" class="block about">
      <h2>About</h2>
      <div class="about-body" id="about-body"></div>
    </section>
  </main>

  <footer class="foot">
    <div class="foot-inner">
      <p id="foot-text"></p>
      <div id="foot-links" class="foot-links"></div>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
