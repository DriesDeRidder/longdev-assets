<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LongDev, Unity tools by Dries De Ridder</title>
  <meta name="description" content="Unity editor tools, VR utilities and environment art by Dries De Ridder, published on the Unity Asset Store as LongDev.">
  <meta name="theme-color" content="#161616">
  <meta property="og:title" content="LongDev">
  <meta property="og:description" content="Unity tools for the slow, repetitive parts of the job.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://longdev-assets.com/">
  <meta property="og:image" content="https://longdev-assets.com/img/batch-lightmap-baker.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://longdev-assets.com/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#assets">Skip to assets</a>

  <header class="top">
    <div class="top-inner">
      <a class="wordmark" href="#">LongDev</a>
      <nav aria-label="Sections">
        <a href="#assets">Assets</a>
        <a href="#roadmap">Roadmap</a>
        <a href="#about">About</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-text">
        <h1 id="tagline"></h1>
        <p class="intro" id="intro"></p>
        <div class="hero-links" id="hero-links"></div>
      </div>
      <figure class="now" aria-labelledby="now-title">
        <figcaption id="now-title">On the bench right now</figcaption>
        <ol class="bars" id="now-bars"></ol>
      </figure>
    </section>

    <section id="assets" class="block">
      <div class="block-head">
        <h2>Assets</h2>
        <div class="filters" role="group" aria-label="Filter assets" id="filters"></div>
      </div>
      <ul class="grid" id="asset-grid"></ul>
    </section>

    <section id="roadmap" class="block">
      <div class="block-head">
        <h2>Roadmap</h2>
        <p class="block-note">What's being built, in the order I'm working on it.</p>
      </div>
      <ol class="stage-scale" id="stage-scale" aria-hidden="true"></ol>
      <ol class="roadmap" id="roadmap-list"></ol>
    </section>

    <section id="about" class="block about">
      <h2>About</h2>
      <div class="about-body" id="about-body"></div>
    </section>
  </main>

  <footer class="foot">
    <div class="foot-inner">
      <p id="foot-text"></p>
      <div id="foot-links" class="foot-links"></div>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
